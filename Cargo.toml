[workspace.package]
version = "0.6.5"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace]
members = [
    "crates/aether-plugin-sdk",
    "crates/aether-plugin-abi",
    "crates/aether-plugin-cdylib-fake",
    "crates/aether-daemon",
    "crates/aether-native-host",
    "crates/aether-update",
    "crates/aether-plugin-fake",
    "crates/aether-plugin-http",
    "crates/aether-plugin-ftp",
    "crates/aether-plugin-media",
    "crates/aether-plugin-bt",
    "crates/aether-plugin-webdav",
    "crates/aether-plugin-extractor",
    "crates/aether-plugin-s3",
    "crates/aether-plugin-sftp",
    "crates/aether-plugin-thunder",
    "crates/aether-plugin-ipfs",
    "crates/aether-plugin-rtmp",
    "crates/aether-plugin-aria2",
    "crates/aether-plugin-cloud",
    "crates/aether-plugin-baidupan",
    "crates/aether-plugin-aliyunpan",
    "crates/aether-host",
    "crates/aether-cli",
]
default-members = ["."]
resolver = "2"

[package]
name = "aether"
version = "0.6.5"
edition = "2021"
rust-version = "1.99"
description = "Aether — a native Material 3 download manager (Rust + Slint, no WebView)"
license = "MIT"
readme = "README.md"

[dependencies]
aether-daemon = { path = "crates/aether-daemon" }
# Text-only clipboard reads; image-data (default) would drag image/tiff/fax in.
arboard = { version = "3.7.0", default-features = false, features = [
    "wayland-data-control",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Advisory file lock for the single-instance guard (already in the tree
# through aether-daemon, so no new supply-chain surface).
fs2 = "0.4"
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    # AccessKit bridge: screen readers can see roles, labels and values.
    "accessibility",
    # `WinitWindowAccessor`: the tray's "show" must also un-minimize and ask
    # the compositor for focus; `Window::show()` alone cannot do either.
    "unstable-winit-030",
    # Cross-platform system tray (Linux ksni / Windows Shell_NotifyIcon /
    # macOS NSStatusItem). One implementation instead of three.
    "system-tray",
] }

# The second-launch endpoint speaks D-Bus — unix only. The tray itself is
# Slint's cross-platform SystemTrayIcon, so Windows builds never compile zbus.
[target.'cfg(unix)'.dependencies]
zbus = "5"

# Desktop notifications: Windows gets WinRT toasts through notify-rust
# (its unix/macOS backends stay out of Windows builds — see src/main.rs
# send_notification, which keeps notify-send/osascript on those platforms).
[target.'cfg(windows)'.dependencies]
notify-rust = "4"

[build-dependencies]
slint-build = "1.18"

[profile.dev]
# 只保留行号信息并剥离调试段，避免 dev 产物像以前那样带上完整 debug_info。
debug = 1
strip = "debuginfo"

[profile.dev.package.aether]
opt-level = "z"
# 具名包覆盖会整段接管该包的 profile，基础 [profile.dev] 的 strip/debug 对它不再生效，
# 所以这里必须重复声明，否则产物仍带完整 debug 段（实测 157MB、10 个 .debug_*）。
debug = 1
strip = "debuginfo"

[profile.dev.package."*"]
# 通配覆盖只作用于没有具名覆盖的依赖包；aether 自身的 opt-level 由上面那一段接管。
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
