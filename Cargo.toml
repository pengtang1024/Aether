[package]
name = "aether"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Aether — a native Material 3 download manager (Rust + Slint, no WebView)"
license = "MIT"
readme = "README.md"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
