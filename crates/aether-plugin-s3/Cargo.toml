[package]
name = "aether-plugin-s3"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "S3-compatible object download plugin for Aether"
license = "MIT"
publish = false

[[bin]]
name = "aether-plugin-s3"
path = "src/main.rs"

[dependencies]
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.13"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
