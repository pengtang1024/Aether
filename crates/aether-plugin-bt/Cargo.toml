[package]
name = "aether-plugin-bt"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "BitTorrent download plugin for Aether"
license = "MIT"
publish = false

[[bin]]
name = "aether-plugin-bt"
path = "src/main.rs"

[dependencies]
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
anyhow = "1"
librqbit = { version = "9.0", default-features = false, features = ["rust-tls"] }
percent-encoding = "2"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
url = "2"
