[package]
name = "aether-plugin-ftp"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "FTP download plugin for Aether"
license = "MIT"
publish = false

[[bin]]
name = "aether-plugin-ftp"
path = "src/main.rs"

[dependencies]
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suppaftp = { version = "10.0.2", default-features = false, features = ["rustls-aws-lc-rs"] }
webpki-roots = "1"
thiserror = "2"
url = "2"
