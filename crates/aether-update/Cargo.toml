[package]
name = "aether-update"
version.workspace = true
edition = "2021"
rust-version = "1.92"
description = "Signed auto-update client for Aether"
license = "MIT"
publish = false

[dependencies]
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
base64 = "0.22"
flate2 = "1"
tar = "0.4"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"

[[bin]]
name = "aether-update-sign"
path = "src/bin/sign.rs"

[[bin]]
name = "aether-plugin-sign"
path = "src/bin/plugin_sign.rs"
