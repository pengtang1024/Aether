[package]
name = "aether-plugin-sftp"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "SFTP download plugin for Aether"
license = "MIT"
publish = false

[[bin]]
name = "aether-plugin-sftp"
path = "src/main.rs"

[dependencies]
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
percent-encoding = "2"
serde_json = "1"
ssh2 = "0.9"
thiserror = "2"
url = "2"
