[package]
name = "aether-daemon"
version.workspace = true
edition = "2021"
rust-version = "1.92"
description = "Aether background download daemon"
license = "MIT"
publish = false

[[bin]]
name = "aether-daemon"
path = "src/main.rs"

[dependencies]
aether-host = { path = "../aether-host" }
aether-update = { path = "../aether-update" }
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
# aria2 WebSocket handshake (Sec-WebSocket-Accept) and frame payloads.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
# OS randomness for the generated default RPC token.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = "2"
flate2 = "1"
serde_json = "1"
tar = "0.4"
