[package]
name = "aether-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Aether background download daemon"
license = "MIT"
publish = false

[[bin]]
name = "aether-daemon"
path = "src/main.rs"

[dependencies]
aether-host = { path = "../aether-host" }
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
