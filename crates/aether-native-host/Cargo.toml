[package]
name = "aether-native-host"
version.workspace = true
edition = "2021"
rust-version = "1.92"
description = "Chrome/Firefox Native Messaging host and desktop URL handler for Aether"
license = "MIT"
publish = false

[[bin]]
name = "aether-native-host"
path = "src/main.rs"

[dependencies]
aether-daemon = { path = "../aether-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

