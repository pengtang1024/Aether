[package]
name = "aether-host"
version.workspace = true
edition = "2021"
rust-version = "1.92"
description = "Host-side plugin discovery, supervision, probing and finalization"
license = "MIT"
publish = false

[dependencies]
aether-plugin-abi = { path = "../aether-plugin-abi" }
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
fs2 = "0.4"
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rquickjs = "0.14"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
