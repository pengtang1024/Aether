[package]
name = "aether-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Host-side plugin discovery, supervision, probing and finalization"
license = "MIT"
publish = false

[dependencies]
aether-plugin-abi = { path = "../aether-plugin-abi" }
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
