[package]
name = "aether-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Verified launcher that starts the newest signed Aether runtime"

[[bin]]
name = "aether-launcher"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "3"
libc = "0.2"
semver = "1"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
