[package]
name = "aether-plugin-media"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "HLS/DASH media download plugin for Aether"
license = "MIT"
publish = false

[[bin]]
name = "aether-plugin-media"
path = "src/main.rs"

[dependencies]
aes = "0.8"
aether-plugin-http = { path = "../aether-plugin-http" }
aether-plugin-sdk = { path = "../aether-plugin-sdk" }
cbc = "0.1"
percent-encoding = "2"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
