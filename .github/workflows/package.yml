name: Package release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check release branch version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          branch="${GITHUB_REF_NAME#release/}"
          if [ -z "$version" ] || [ "$version" != "$branch" ]; then
            echo "release branch must be named release/$version (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }} .deb + AppImage
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # branch 1.92.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev \
            desktop-file-utils appstream dpkg-dev make curl

      - name: Validate desktop entries, metadata and license recipes
        run: |
          make check
          make check-licenses

      - name: Build .deb
        env:
          ARCH: ${{ matrix.deb_arch }}
        run: make deb

      - name: Build AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APPIMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/metainfo \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          install -m755 target/release/aether AppDir/usr/bin/aether
          install -m755 target/release/aether-cli AppDir/usr/bin/aether-cli
          install -m755 target/release/aether-daemon AppDir/usr/bin/aether-daemon
          install -m755 target/release/aether-native-host AppDir/usr/bin/aether-native-host
          install -m644 packaging/aether.desktop AppDir/usr/share/applications/aether.desktop
          install -m644 packaging/aether.metainfo.xml \
            AppDir/usr/share/metainfo/io.github.pengtang1024.Aether.metainfo.xml
          install -m644 assets/logo-icon-256.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/aether.png
          install -d AppDir/usr/share/doc/aether
          install -m644 LICENSE THIRD_PARTY_NOTICES.md \
            AppDir/usr/share/doc/aether/
          install -m644 LICENSES/Slint-Royalty-free-2.0.md \
            AppDir/usr/share/doc/aether/
          install -d AppDir/usr/lib/aether/plugins
          cp -a build/plugins/. AppDir/usr/lib/aether/plugins/
          cp packaging/aether.desktop AppDir/aether.desktop
          cp assets/logo-icon-256.png AppDir/aether.png
          cat > AppDir/AppRun <<'RUN'
          #!/bin/sh
          exec "${APPDIR}/usr/bin/aether" "$@"
          RUN
          chmod +x AppDir/AppRun
          curl -fL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage"
          chmod +x /tmp/appimagetool
          ARCH="${APPIMAGE_ARCH}" APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool \
            AppDir "dist/aether-${VERSION}-linux-${APPIMAGE_ARCH}.AppImage"

      - name: Check license notices in Linux packages
        run: python3 scripts/check-license-bundles.py dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aether-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            dist/aether_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb
            dist/aether-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} installer
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # branch 1.92.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}

      - name: Build release binaries
        # Workspace build: the UI, daemon, CLI, native host and every
        # first-party plugin binary (the installers must ship them all —
        # the UI spawns aether-daemon.exe from its own directory and the
        # daemon resolves plugins\ beside itself).
        run: cargo build --release --workspace

      - name: Stage plugin packages
        run: py -3 scripts/stage-plugins.py --target-dir target/release --out build/plugins

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $files = @(
            "target/release/aether.exe",
            "target/release/aether-daemon.exe",
            "target/release/aether-cli.exe",
            "target/release/aether-native-host.exe",
            "build/plugins",
            "assets/logo.ico",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "LICENSES",
            "README.md"
          )
          Compress-Archive -Force -Path $files `
            -DestinationPath "dist/aether-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.zip"

      - name: Check license notices in portable ZIP
        shell: pwsh
        run: py -3 scripts/check-license-bundles.py dist

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" |
              Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" `
                  "/DAppArch=${{ matrix.arch }}" `
                  "/DRepoRoot=${{ github.workspace }}" `
                  "packaging\windows\aether.iss"

      - name: Check installer license recipe
        shell: pwsh
        run: py -3 scripts/check-license-bundles.py --check-recipes

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aether-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal DMG
    needs: version
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # branch 1.92.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-14

      - name: Build universal app bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

          rm -rf Aether.app Aether.iconset dist
          mkdir -p Aether.app/Contents/MacOS Aether.app/Contents/Resources Aether.iconset dist
          lipo -create \
            target/aarch64-apple-darwin/release/aether \
            target/x86_64-apple-darwin/release/aether \
            -output Aether.app/Contents/MacOS/aether
          chmod +x Aether.app/Contents/MacOS/aether
          sed "s/@VERSION@/${VERSION}/g" packaging/macos/Info.plist \
            > Aether.app/Contents/Info.plist

          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/logo-icon-512.png \
              --out "Aether.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/logo-icon-512.png \
              --out "Aether.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns Aether.iconset \
            -o Aether.app/Contents/Resources/aether.icns
          cp LICENSE THIRD_PARTY_NOTICES.md Aether.app/Contents/Resources/
          mkdir -p Aether.app/Contents/Resources/licenses
          cp LICENSES/Slint-Royalty-free-2.0.md \
            Aether.app/Contents/Resources/licenses/

          codesign --force --deep --sign - Aether.app
          hdiutil create -volname "Aether" -srcfolder Aether.app \
            -ov -format UDZO "dist/aether-${VERSION}-macos-universal.dmg"

      - name: Check license notices in DMG
        run: python3 scripts/check-license-bundles.py dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aether-${{ needs.version.outputs.version }}-macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: [version, linux, windows, macos]
    # Linux is the release gate. Windows/macOS still run and their artifacts
    # are attached when they succeed, but a secondary-platform failure must
    # not block a Linux release.
    if: always() && needs.version.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: aether-*
          merge-multiple: true
          path: artifacts

      # SBOM first so the checksums below cover it. cargo-cyclonedx only
      # reads the workspace metadata + lockfile (no build), and the resulting
      # document describes the source dependency set shared by every
      # platform artifact of this release.
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # branch 1.92.0
      - name: Generate SBOM (CycloneDX)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo install cargo-cyclonedx --locked
          # Workspace mode emits one file per member; the root package is
          # the product. --override-filename takes the name without the
          # format extension (the tool appends ".json").
          cargo cyclonedx --format json --override-filename "aether-${VERSION}.cdx"
          mv "aether-${VERSION}.cdx.json" "artifacts/aether-${VERSION}.cdx.json"

      - name: Generate update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          AETHER_UPDATE_SECRET_KEY: ${{ secrets.AETHER_UPDATE_SECRET_KEY }}
        run: |
          python3 scripts/make-update-manifest.py \
            --dist artifacts --version "$VERSION" --out artifacts/update.json
          if [ -n "$AETHER_UPDATE_SECRET_KEY" ]; then
            cargo run --quiet -p aether-update --bin aether-update-sign -- artifacts/update.json
          else
            echo "::warning::AETHER_UPDATE_SECRET_KEY is not configured; dropping the unsigned update manifest (unsigned manifests must not ship)"
            rm -f artifacts/update.json
          fi

      - name: Prepare release notes and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="docs/releases/${VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          cp "$notes" release-body.md
          (cd artifacts && sha256sum * > SHA256SUMS)

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Aether ${{ needs.version.outputs.version }}
          body_path: release-body.md
          draft: true
          prerelease: false
          files: artifacts/*
          fail_on_unmatched_files: true

      # The release action reliably attaches files, but existing drafts have
      # been observed to keep an empty body; apply the notes explicitly.
      - name: Apply release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v${VERSION}" --notes-file release-body.md
