name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux fmt/build/test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # branch 1.92.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-ubuntu-22.04
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cargo fmt --all --check
      - run: make check-licenses
      - run: cargo test --workspace
        env:
          AETHER_FAKE_TRACE: "1"
      - run: cargo build --release --workspace
      - name: Check package license bundle
        run: |
          make deb
          make check-licenses

  windows:
    name: Windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # branch 1.92.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-windows-latest
      - run: cargo check --workspace --all-targets
      # The pipe loopback (transport.rs) and the TCP RPC loopback (rpc.rs)
      # are both cross-platform acceptance tests for the local/remote IPC.
      - run: cargo test -p aether-daemon --test transport --test rpc
      # Bin tests: the Windows tray (FFI layout, message-only window,
      # best-effort icon handshake — Some/None both accepted on a headless
      # runner) plus the cross-platform i18n/backend/chart suites.
      - run: cargo test --bin aether
      # The Windows plugin-dir candidate (exe-adjacent plugins\) is what
      # the installer layout relies on; name-filtered so only it runs here.
      - run: cargo test -p aether-host plugin_dir

  macos:
    name: macOS check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # branch 1.92.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-macos-14
      - run: cargo check --workspace --all-targets

  cargo-deny:
    name: Supply-chain policy (cargo-deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          rust-version: "1.92.0"
