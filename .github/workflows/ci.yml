name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux fmt/build/test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-ubuntu-22.04
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cargo fmt --all --check
      - run: make check-licenses
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Check package license bundle
        run: |
          make deb
          make check-licenses

  windows:
    name: Windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows-latest
      - run: cargo check --workspace --all-targets

  macos:
    name: macOS check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-macos-14
      - run: cargo check --workspace --all-targets
